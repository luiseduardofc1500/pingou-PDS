# ==============================================
# Configurações do Sistema de Assinatura de HQs
# ==============================================

# Nome da aplicação
spring.application.name=hq-subscription-system

# ==============================================
# Database Configuration
# ==============================================

# H2 Database (Desenvolvimento/Testes)
spring.datasource.url=jdbc:h2:mem:hqdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL (Produção - descomentar quando usar)
#spring.datasource.url=jdbc:postgresql://localhost:5432/hqdb
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.username=hquser
#spring.datasource.password=hqpass
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (desabilitar em produção)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================
# JPA / Hibernate
# ==============================================

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ==============================================
# Inicialização de Dados
# ==============================================

# Scripts SQL de inicialização
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data/hq-initial-data.sql

# ==============================================
# OpenAPI / Swagger Documentation
# ==============================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packagesToScan=com.subscription.framework.hq.controller

# Informações da API
springdoc.info.title=Sistema de Assinatura de HQs
springdoc.info.description=API para gerenciamento de assinaturas de quadrinhos com curadoria inteligente
springdoc.info.version=1.0.0
springdoc.info.contact.name=Equipe de Desenvolvimento
springdoc.info.contact.email=contato@hqsystem.com

# ==============================================
# Server Configuration
# ==============================================

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ==============================================
# Security Configuration
# ==============================================

# JWT Configuration
jwt.secret=hq-system-secret-key-change-in-production-with-strong-key
jwt.expiration=86400000

# ==============================================
# Logging
# ==============================================

logging.level.root=INFO
logging.level.com.subscription.framework.hq=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================================
# Configurações Específicas de HQ
# ==============================================

# Sistema de Pontos
hq.pontos.bonus-leitura=50
hq.pontos.bonus-avaliacao=25
hq.pontos.bonus-onboarding=100
hq.pontos.pontos-por-nivel=1000

# Curadoria
hq.curadoria.peso-editora=30
hq.curadoria.peso-categoria=40
hq.curadoria.peso-colecionador=20
hq.curadoria.peso-serie=10
hq.curadoria.fator-aleatorio=5

# Estoque
hq.estoque.alerta-minimo=5
hq.estoque.reabastecer-automatico=true

# Pacotes
hq.pacotes.gerar-automaticamente=true
hq.pacotes.dia-geracao=1
hq.pacotes.antecedencia-dias=30

# Notificações (para implementação futura)
hq.notificacoes.email-enabled=false
hq.notificacoes.push-enabled=false

# ==============================================
# Validação
# ==============================================

spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ==============================================
# Performance
# ==============================================

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==============================================
# Actuator (Monitoramento)
# ==============================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
